<style>
:root{--bg:#0b0e0d;--panel:#141816;--line:#2a302c;--txt:#ece9df;--gold:#c7a45a;--dim:#92988f;--cell:#202622;--ink:#101411;--paper:#e8e2d3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Segoe UI',sans-serif;background:var(--bg);color:var(--txt)}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
h1{font-size:1.5em;margin:0;letter-spacing:6px;font-weight:700}
h1 small{font-size:.38em;letter-spacing:4px;color:var(--gold);font-weight:500;display:block;margin-top:3px}
.lang{background:none;border:1px solid var(--line);color:var(--dim);border-radius:18px;padding:5px 12px;font-size:.78em;cursor:pointer}
.hud{display:flex;justify-content:space-between;align-items:center;margin:10px 2px}
.goal{font-size:.95em}.goal b{color:var(--gold);font-size:1.15em}
.moves{font-family:ui-monospace,monospace;color:var(--dim);font-size:.9em}
.lvlname{text-align:center;color:var(--dim);font-size:.82em;letter-spacing:2px;margin-bottom:6px}
#board{position:relative;background:var(--panel);border-radius:16px;padding:10px;margin:0 auto;touch-action:none;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.cell{position:absolute;border-radius:11px;background:var(--cell)}
.wall{position:absolute;border-radius:11px;background:repeating-linear-gradient(45deg,#2c313d,#2c313d 6px,#262a34 6px,#262a34 12px)}
.tile{position:absolute;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;
  transition:transform .13s cubic-bezier(.3,.9,.4,1);will-change:transform;z-index:5}
.tile.merged{animation:pop .2s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.tile.spawned{animation:sp .18s ease}
@keyframes sp{from{transform:scale(.3);opacity:0}}
.btns{display:flex;gap:10px;margin-top:16px;justify-content:center}
.btn{flex:1;max-width:150px;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font-size:.95em;cursor:pointer;transition:.12s}
.btn:active{transform:scale(.96)}.btn.gold{background:linear-gradient(180deg,#e6bd63,#d09a3c);border:0;color:#2a1c04;font-weight:700}
.hint{text-align:center;color:#5b6070;font-size:.76em;margin-top:14px;line-height:1.5}
.levels{margin-top:10px}
.lvhdr{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:.92em;color:var(--dim);user-select:none}
.lvhdr b{color:var(--gold)}
.lvarr{color:var(--gold);font-size:1.05em}
.lvgrp{margin:10px 2px 6px;font-size:.75em;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.lvgrid{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-height:180px;overflow-y:auto;padding:2px}
.lv{width:34px;height:34px;border-radius:9px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.85em;cursor:pointer;color:var(--dim)}
.lv.done{border-color:var(--gold);color:var(--gold)}.lv.cur{background:var(--gold);color:#2a1c04;border:0;font-weight:700}
.overlay{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 50% 40%,rgba(40,34,18,.9),rgba(0,0,0,.9));border-radius:16px}
.overlay h2{font-size:2em;color:var(--gold);letter-spacing:2px;margin:0 0 6px}
.stars{font-size:1.8em;margin:8px 0}
.support{margin-top:26px;padding:12px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--dim);font-size:.78em;line-height:1.6}
.support b{color:var(--gold)}
/* intro overlay */
#introOv{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#0a0d0c;padding:20px;overflow:hidden}
#introOv.show{display:flex}
.foldField{position:absolute;inset:-10%;width:120%;height:120%;opacity:.62;pointer-events:none}
.foldField line,.foldField path,.foldField polygon,.foldField circle{vector-effect:non-scaling-stroke}
.foldField .orbit{transform-origin:50% 50%;animation:orbit 28s linear infinite}
.foldField .orbit.rev{animation-direction:reverse;animation-duration:39s}
.foldField .breath{transform-origin:50% 50%;animation:breath 7s ease-in-out infinite}
.foldField .draw{stroke-dasharray:280;animation:draw 8s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes breath{50%{transform:scale(.72);opacity:.35}}
@keyframes draw{0%,100%{stroke-dashoffset:280}45%,70%{stroke-dashoffset:0}}
.introCard{position:relative;z-index:2;max-width:430px;width:100%;background:rgba(15,19,17,.76);border:1px solid rgba(199,164,90,.28);border-radius:2px;padding:34px 28px 26px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.62);backdrop-filter:blur(14px)}
.introCard:before,.introCard:after{content:"";position:absolute;width:32px;height:32px;border-color:var(--gold);opacity:.65}
.introCard:before{left:-1px;top:-1px;border-left:1px solid;border-top:1px solid}.introCard:after{right:-1px;bottom:-1px;border-right:1px solid;border-bottom:1px solid}
.introCard h2{margin:0;color:var(--paper)}
.wordmark-latin{font:300 clamp(3.6rem,16vw,5.6rem)/.9 Georgia,serif;letter-spacing:.18em;margin-right:-.18em}
.wordmark-east{font:300 clamp(3.8rem,17vw,5.8rem)/1.05 'Songti SC','Noto Serif CJK SC','Yu Mincho',serif;letter-spacing:.28em;margin-right:-.28em}
.wordmark-east .one{display:inline-block;color:var(--gold);transform:translateY(-.04em)}
.wordmark-sub{display:block;font:500 .64rem/1.2 ui-monospace,monospace;letter-spacing:.48em;color:var(--gold);margin:13px 0 0}
.introCard .sub{color:#b7b9b2;font-size:.82em;letter-spacing:.08em;margin:13px 0 22px;line-height:1.6}
.introRules{text-align:left;font-size:.88em;line-height:1.7;margin:0 0 14px;color:var(--txt)}
.introRules div{margin:6px 0}
.introRules .dm{color:var(--gold);margin-right:9px}
.introFine{color:#5b6070;font-size:.74em;margin-bottom:18px}
.introLangs{display:flex;justify-content:center;gap:5px;margin:0 0 18px}
.introLangs button{background:transparent;border:0;border-bottom:1px solid transparent;color:#6f756e;padding:5px 7px;font:600 .65rem ui-monospace,monospace;cursor:pointer}
.introLangs button.sel{color:var(--gold);border-bottom-color:var(--gold)}
.introBtn{width:100%;background:transparent;border:1px solid var(--gold);color:var(--paper);font-weight:600;border-radius:2px;padding:13px;font-size:.92em;letter-spacing:.14em;cursor:pointer}
.introBtn:active{transform:scale(.97)}
@media(prefers-reduced-motion:reduce){.foldField *{animation:none!important}}
</style></head><body>
<div id="app">
  <div class="top"><h1 id="brandTitle">FOLD</h1><div style="display:flex;gap:8px"><button class="lang" onclick="openIntro()" style="width:34px;padding:5px 0" aria-label="How to play">?</button><button class="lang" id="langBtn" onclick="toggleLang()">EN</button></div></div>
  <div id="introOv"><svg class="foldField" viewBox="0 0 1000 1000" aria-hidden="true">
    <defs><linearGradient id="foldGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7a45a"/><stop offset="1" stop-color="#52685d"/></linearGradient></defs>
    <g fill="none" stroke="url(#foldGold)" stroke-width="1">
      <g class="orbit"><polygon points="500,92 854,296 854,704 500,908 146,704 146,296"/><circle cx="500" cy="500" r="288"/><path d="M146 296L854 704M854 296L146 704M500 92V908"/></g>
      <g class="orbit rev" opacity=".55"><rect x="272" y="272" width="456" height="456" transform="rotate(45 500 500)"/><circle cx="500" cy="500" r="182"/><path d="M500 318L682 500 500 682 318 500Z"/></g>
      <g class="breath" fill="rgba(199,164,90,.07)"><polygon points="500,376 624,500 500,624 376,500"/><circle cx="500" cy="500" r="42"/></g>
      <path class="draw" d="M80 500H920M500 80V920" opacity=".5"/>
    </g>
  </svg><div class="introCard" id="introCard"></div></div>
  <div class="lvlname" id="lvlname"></div>
  <div class="hud"><div class="goal" id="goal"></div><div class="moves" id="moves"></div></div>
  <div id="boardWrap" style="position:relative"><div id="board"></div>
    <div class="overlay" id="win"></div>
  </div>
  <div class="btns">
    <button class="btn" onclick="undo()" id="undoBtn">↶ <span id="undoT">撤销</span></button>
    <button class="btn" onclick="reset()"><span id="resetT">重来</span></button>
  </div>
  <div class="levels" id="levels"></div>
  <div class="hint" id="hint"></div>
  <div class="support" id="support"></div>
</div>
<script>
// ---------- 关卡(手工设计,确定性;后续RL无限生成) ----------
// grid: 行数组; 数字=初始块值, 'x'=墙, 0=空. target=归一目标值. par=满星步数.
let LEVELS = [
 {name:"入门 / Warmup", target:4, par:1, grid:[[2,2]]},
 {name:"折返 / Corner", target:8, par:2, grid:[[2,2,0],[0,2,2]]},
 {name:"夹墙 / Walls", target:8, par:2, grid:[[2,'x',2],[2,0,2]]},
 {name:"四合 / Fourfold", target:8, par:2, grid:[[2,2],[2,2]]},
 {name:"孤岛 / Island", target:16, par:2, grid:[[4,0,4],[0,0,0],[4,0,4]]},
 {name:"八合 / Octet", target:32, par:3, grid:[[4,4,4,4],[0,0,0,0],[4,4,4,4]]},
 {name:"阶梯 / Ladder", target:16, par:5, grid:[[2,2,2],[2,0,2],[2,2,2]]},
 {name:"迷宫 / Maze", target:16, par:5, grid:[[2,2,'x',4],[0,'x',0,4],[2,2,'x',0],['x',0,0,0]]},
];
const PAL={2:'#3c4657',4:'#4a5a7a',8:'#5b7bba',16:'#c98a3e',32:'#d9a63f',64:'#e0b356',128:'#e6c674',256:'#efd98f'};
let COACH={}; fetch('coach_tips.json').then(r=>r.json()).then(d=>COACH=d).catch(()=>{});
function coachTier(par){return par<=3?'easy':par<=6?'medium':par<=9?'hard':'expert';}
const LANGS=['en','es','pt','zh','ja'];
function initialLang(){
 const saved=localStorage.getItem('fold_lang'); if(LANGS.includes(saved))return saved;
 const n=(navigator.language||'en').toLowerCase();
 if(n.startsWith('zh'))return'zh'; if(n.startsWith('ja'))return'ja';
 if(n.startsWith('es'))return'es'; if(n.startsWith('pt'))return'pt'; return'en';
}
let L=0, R, C, cells, walls, tiles, moves, hist, done, lang=initialLang();
const T={zh:{goal:t=>`目标 · 归一至 <b>${t}</b>`,moves:m=>`第 ${m} 手`,undo:"撤销",reset:"重置",
  hint:"滑动或方向键 · 同值合并 · 把所有数字归并成唯一目标块",win:"归 一",
  next:"下一关",retry:"再来",share:"晒战绩",stars:s=>["","一星","两星","满星"][s],
  support:'永久免费 · <b>永不广告</b><br>每日一局，静观万物归一',
  parhint:s=>`满星 ${s} 步`},
 ja:{goal:t=>`目標 · <b>${t}</b> へ帰一`,moves:m=>`${m} 手`,undo:"戻す",reset:"初めから",
  hint:"スワイプ／矢印キー · 同じ数を重ねる · すべてを一つに",win:"帰 一",
  next:"次へ",retry:"もう一度",share:"共有",stars:s=>["","一つ星","二つ星","満星"][s],
  support:'ずっと無料 · <b>広告なし</b><br>一日一局、万象が一へ帰すのを観る',
  parhint:s=>`満星は ${s} 手`},
 en:{goal:t=>`Fold everything into <b>${t}</b>`,moves:m=>`Move ${m}`,undo:"Undo",reset:"Reset",
  hint:"Swipe or arrows · equal tiles merge · fold all into one target tile",win:"UNITY",
  next:"Next",retry:"Retry",share:"Share",stars:s=>["","1 star","2 stars","3 stars"][s],
  support:'Free forever · <b>No ads, ever</b><br>One quiet puzzle, every day',
  parhint:s=>`${s} moves for 3★`},
 es:{goal:t=>`Pliega todo en <b>${t}</b>`,moves:m=>`Movimiento ${m}`,undo:"Deshacer",reset:"Reiniciar",
  hint:"Desliza o usa las flechas · une iguales · reduce todo a una sola ficha",win:"UNIDAD",
  next:"Siguiente",retry:"Reintentar",share:"Compartir",stars:s=>["","1 estrella","2 estrellas","3 estrellas"][s],
  support:'Gratis para siempre · <b>Sin anuncios</b><br>Un puzle sereno cada día',
  parhint:s=>`${s} movimientos para 3★`},
 pt:{goal:t=>`Dobre tudo em <b>${t}</b>`,moves:m=>`Jogada ${m}`,undo:"Desfazer",reset:"Reiniciar",
  hint:"Deslize ou use as setas · números iguais se unem · transforme tudo em uma peça",win:"UNIDADE",
  next:"Próximo",retry:"Tentar de novo",share:"Compartilhar",stars:s=>["","1 estrela","2 estrelas","3 estrelas"][s],
  support:'Grátis para sempre · <b>Sem anúncios</b><br>Um desafio tranquilo por dia',
  parhint:s=>`${s} jogadas para 3★`}};
function tr(){return T[lang]}
function load(l){
 L=l; const lv=LEVELS[l]; R=lv.grid.length; C=Math.max(...lv.grid.map(r=>r.length));
 cells=[]; walls=[]; tiles=[]; let id=0;
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){
   const v=lv.grid[r][c];
   if(v==='x') walls.push({r,c});
   else if(typeof v==='number'&&v>0) tiles.push({id:id++,r,c,v,merged:false,spawned:false});
 }
 moves=0; hist=[]; done=false;
 document.getElementById('lvlname').textContent=lv.name;
 document.getElementById('win').style.display='none';
 layout(); render(); renderLevels(); syncText();
 localStorage.setItem('fold_cur',l);
 if(window.TEL)TEL.ev('level_opened',{language:lang,level:l+1,group:l<51?'curated':'endless'});
}
let CS, GAP=8;
function layout(){
 const wrap=document.getElementById('app').clientWidth-32;
 const bw=Math.min(wrap, 420);
 CS=Math.floor((bw-20-GAP*(C-1))/C);
 const b=document.getElementById('board');
 b.style.width=(CS*C+GAP*(C-1)+20)+'px'; b.style.height=(CS*R+GAP*(R-1)+20)+'px';
 b.innerHTML='';
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){
   const d=document.createElement('div'); d.className='cell';
   d.style.cssText+=`width:${CS}px;height:${CS}px;left:${px(c)}px;top:${px(r)}px`;
   b.appendChild(d);
 }
 walls.forEach(w=>{const d=document.createElement('div');d.className='wall';
   d.style.cssText+=`width:${CS}px;height:${CS}px;left:${px(w.c)}px;top:${px(w.r)}px`;b.appendChild(d);});
}
function px(i){return 10+i*(CS+GAP)}
function fontFor(v){return Math.max(14, CS*0.42 - String(v).length*2)}
function render(){
 const b=document.getElementById('board');
 [...b.querySelectorAll('.tile')].forEach(e=>e.remove());
 tiles.forEach(t=>{
   const d=document.createElement('div');
   d.className='tile'+(t.merged?' merged':'')+(t.spawned?' spawned':'');
   d.style.cssText+=`width:${CS}px;height:${CS}px;font-size:${fontFor(t.v)}px;background:${PAL[t.v]||'#efd98f'};`+
     `color:${t.v<=8?'#dfe6f0':'#241a06'};transform:translate(${px(t.c)}px,${px(t.r)}px)`;
   d.textContent=t.v; b.appendChild(d);
   t.merged=false; t.spawned=false;
 });
}
function isWall(r,c){return walls.some(w=>w.r===r&&w.c===c)}
function tileAt(r,c,arr){return arr.find(t=>t.r===r&&t.c===c)}
function move(dr,dc){
 if(done) return;
 const snap=JSON.stringify(tiles.map(t=>({id:t.id,r:t.r,c:t.c,v:t.v})));
 const order=[...tiles].sort((a,b)=>((b.r-a.r)*dr+(b.c-a.c)*dc));
 let moved=false; const mergedIds=new Set();
 for(const t of order){
   let r=t.r,c=t.c;
   while(true){
     const nr=r+dr,nc=c+dc;
     if(nr<0||nr>=R||nc<0||nc>=C||isWall(nr,nc)) break;
     const occ=tileAt(nr,nc,tiles);
     if(!occ){ r=nr;c=nc; continue; }
     if(occ.v===t.v && !mergedIds.has(occ.id) && occ.id!==t.id){
       occ.v*=2; occ.merged=true; mergedIds.add(occ.id);
       tiles=tiles.filter(x=>x.id!==t.id); moved=true;
     }
     break;
   }
   if((r!==t.r||c!==t.c)){ t.r=r;t.c=c; moved=true; }
 }
 if(moved){ hist.push(snap); moves++; render(); syncText(); checkWin();
   if(window.TEL)TEL.ev('move_made',{language:lang,level:L+1,move:moves,direction:[dr,dc]}); }
}
function checkWin(){
 if(tiles.length===1 && tiles[0].v===LEVELS[L].target){
   done=true; const par=LEVELS[L].par;
   const stars = moves<=par?3 : moves<=par+2?2 : 1;
   const doneLv=JSON.parse(localStorage.getItem('fold_done')||'{}');
   doneLv[L]=Math.max(doneLv[L]||0,stars); localStorage.setItem('fold_done',JSON.stringify(doneLv));
   if(window.TEL)TEL.ev('level_completed',{language:lang,level:L+1,moves,stars,par});
   const w=document.getElementById('win'); w.style.display='flex';
   const next=L<LEVELS.length-1;
   w.innerHTML=`<h2>${tr().win}</h2><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>\n     ${(COACH[coachTier(par)]&&COACH[coachTier(par)].length)?`<div style="color:#c9b78a;font-size:.9em;max-width:280px;margin:8px auto;line-height:1.5">\u201c${COACH[coachTier(par)][Math.floor(Math.random()*COACH[coachTier(par)].length)]}\u201d</div>`:``}
     <div style="color:#c9b78a">${tr().moves(moves)} · ${tr().parhint(par)}</div>
     <div class="btns" style="margin-top:22px">
       <button class="btn" onclick="load(${L})">${tr().retry}</button>
       ${next?`<button class="btn gold" onclick="load(${L+1})">${tr().next} →</button>`:''}</div>
     <button class="btn" style="margin-top:12px;max-width:200px" onclick="share(${stars},${moves})">🔗 ${tr().share}</button>
     ${fbHTML()}`;
   renderLevels();
 }
}
/* ---- lightweight feedback ---- */
function fbPid(){try{let p=localStorage.getItem('fold_pid');if(!p){p=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('fold_pid',p);}return p;}catch(e){return 'anon';}}
function fbSend(score,note){try{fetch(window.APP_API+'/scout/api/game_feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:'fold',score:score,note:note||'',pid:fbPid()})}).catch(()=>{});}catch(e){}}
function fbHTML(){
 try{
  if(typeof window.APP_API==='undefined'||!window.APP_API) return '';
  const today=new Date().toISOString().slice(0,10);
  if(localStorage.getItem('fold_fb_last')===today) return '';
  const zh=lang==='zh';
  return `<div id="fbRow" style="margin-top:16px;font-size:.85em;color:var(--dim,#c9b78a)">
    <span>${zh?'好玩吗?':'Fun?'}</span>
    ${[['😍',3],['😐',2],['🥱',1]].map(([e,s])=>`<button onclick="fbPick(${s})" style="background:none;border:none;font-size:1.4em;cursor:pointer;padding:2px 6px">${e}</button>`).join('')}
  </div>`;
 }catch(e){return '';}
}
function fbPick(score){
 try{localStorage.setItem('fold_fb_last',new Date().toISOString().slice(0,10));}catch(e){}
 fbSend(score,'');
 const zh=lang==='zh', row=document.getElementById('fbRow');
 if(!row) return;
 row.innerHTML=`<div style="color:#c9b78a">${zh?'谢谢!':'Thanks!'}</div>
   <div style="margin-top:8px;display:flex;gap:6px;justify-content:center;opacity:0;transition:opacity .6s" id="fbNote">
     <input id="fbNoteIn" maxlength="200" placeholder="${zh?'一句话建议(可选)':'One-line suggestion (optional)'}" style="background:#1a1d26;border:1px solid var(--line,#3a3626);color:#e8dcc0;border-radius:14px;padding:5px 10px;font-size:.9em;width:180px">
     <button class="btn" style="padding:5px 12px;font-size:.85em;max-width:70px" onclick="fbNoteSend(${score})">${zh?'发送':'Send'}</button>
   </div>`;
 requestAnimationFrame(()=>{const n=document.getElementById('fbNote');if(n)n.style.opacity='1';});
}
function fbNoteSend(score){

// pointer gesture (mouse drag + touch swipe); one move per gesture
const bw=document.getElementById('boardWrap');
bw.style.touchAction='none';
const SWIPE_TH=24;
let ptr=null; // {id,sx,sy,fired}
function fireSwipe(dx,dy){
 if(Math.max(Math.abs(dx),Math.abs(dy))<SWIPE_TH) return false;
 if(Math.abs(dx)>Math.abs(dy)) move(0,dx>0?1:-1); else move(dy>0?1:-1,0);
 return true;
}
bw.addEventListener('pointerdown',e=>{

 ptr={id:e.pointerId,sx:e.clientX,sy:e.clientY,fired:false};
 try{bw.setPointerCapture(e.pointerId);}catch(_){}
});
// 拖动时整个棋盘跟手微移(上限10px,主轴向): 视觉上明确"推的是整盘,不是单块"
const bdEl=document.getElementById('board');
function boardFollow(dx,dy){
 if(!bdEl)return;
 const cap=10, ax=Math.abs(dx)>Math.abs(dy);
 const fx=ax?Math.max(-cap,Math.min(cap,dx/4)):0, fy=ax?0:Math.max(-cap,Math.min(cap,dy/4));
 bdEl.style.transition='none'; bdEl.style.transform=`translate(${fx}px,${fy}px)`;
}
function boardSnap(){
 if(!bdEl)return;
 bdEl.style.transition='transform .16s cubic-bezier(.2,.7,.3,1)'; bdEl.style.transform='translate(0,0)';
}
bw.addEventListener('pointermove',e=>{
 if(!ptr||e.pointerId!==ptr.id||ptr.fired)return;
 const dx=e.clientX-ptr.sx, dy=e.clientY-ptr.sy;
 boardFollow(dx,dy);
 if(fireSwipe(dx,dy)){ ptr.fired=true; boardSnap(); }
});
function endPtr(e){
 if(!ptr||e.pointerId!==ptr.id)return;
 if(!ptr.fired) fireSwipe(e.clientX-ptr.sx,e.clientY-ptr.sy);
 boardSnap();
 ptr=null;
 try{bw.releasePointerCapture(e.pointerId);}catch(_){}
}
bw.addEventListener('pointerup',endPtr);
bw.addEventListener('pointercancel',endPtr);

<script>
// 统一埋点SDK: 自动记录pageview/click/停留/会话时长, 手动记录chat/feedback
(function(){
  const API = window.TEL_API || (window.API || "");
  const pid = (function(){let p=localStorage.getItem("tel_pid");
    if(!p){p="u"+Math.random().toString(36).slice(2,10);localStorage.setItem("tel_pid",p);}return p;})();
  const sid = "s"+Math.random().toString(36).slice(2,10);
  const t0 = Date.now();
  let queue = [];
  function push(etype,name,value,dur){
    queue.push({pid,sid,etype,name:String(name||"").slice(0,120),
                value:typeof value==="string"?value:JSON.stringify(value||""),dur:dur||0});
    if(queue.length>=8) flush();
  }
  function flush(useBeacon){
    if(!queue.length||!API) return;
    const batch = queue.splice(0,50);
    const body = JSON.stringify(batch);
    if(useBeacon && navigator.sendBeacon){
      navigator.sendBeacon(API+"/tel_batch", new Blob([body],{type:"application/json"}));
    } else {
      fetch(API+"/tel_batch",{method:"POST",headers:{"Content-Type":"application/json"},body}).catch(()=>{});
    }
  }
  // 自动: pageview
  push("pageview", location.pathname||"/", document.title||"");
  // 自动: 所有click(记录元素id/class/文本)
  document.addEventListener("click", e=>{
    const el=e.target.closest("button,a,[data-tel],.card,.chip,[role=button]");
    if(!el)return;
    push("click", el.id||el.dataset.tel||el.className||el.tagName,
         (el.innerText||"").trim().slice(0,60));
  }, true);
  // 自动: 会话时长(离开时上报)
  window.addEventListener("beforeunload", ()=>{
    push("session_end","session","",Math.round((Date.now()-t0)/1000));
    flush(true);
  });
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flush(true); });
  setInterval(()=>flush(), 20000);   // 定期flush
  // 暴露手动埋点: TEL.chat(用户消息,回复) / TEL.feedback(分数,留言) / TEL.ev(类型,名,值)
  window.TEL = {
    chat: (userMsg, reply, meta)=>push("chat","message",{u:String(userMsg).slice(0,800),r:String(reply).slice(0,1200),...(meta||{})}),
    feedback: (score, note)=>push("feedback","rating",{score,note:String(note||"").slice(0,500)}),
    ev: (name, value)=>push("custom",name,value),
    flush
  };
})();
</script>


<script>
/* 通用等待动画: 任何异步请求期间显示"思考中"呼吸提示, 零服务器成本 */
(function(){

  const HINTS={zh:["正在思考…","整理中…","正在分析…","稍等一下…"],
               en:["thinking…","working on it…","analyzing…","one moment…"]};
  window.showWaiting=function(elId){
    const el=document.getElementById(elId)||document.querySelector("[data-wait]")||document.body;
    const zh=(document.documentElement.lang||navigator.language||"").toLowerCase().startsWith("zh");
    const hints=zh?HINTS.zh:HINTS.en;
    let d=0,hi=Math.floor(Math.random()*hints.length);
    window._waitEl=el; window._waitPrev=el.innerHTML;
    _wt=setInterval(()=>{d=(d+1)%4;
      el.innerHTML=`<div style="opacity:.6;font-style:italic;padding:12px">${hints[hi]}${".".repeat(d)}</div>`;
      if(d===0&&Math.random()<0.3)hi=(hi+1)%hints.length;},520);
  };
  window.hideWaiting=function(){if(_wt){clearInterval(_wt);_wt=null;}};
})();
